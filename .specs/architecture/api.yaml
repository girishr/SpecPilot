# SpecPilot SDD CLI — Interface Specification
# fileID: API-001
# lastUpdated: 2026-10-10 (BL-PM-010/BL-PM-013 built)
# version: 2.33
#
# NOTE: SpecPilot is a CLI tool, not a REST service. This file documents
# the command-line interface (commands, flags, arguments, exit codes).

cli:
  binary: specpilot
  version: 2.12.0
  runtime: Node.js >= 16
  install: npm install -g specpilot

commands:

  init:
    description: Initialize a new project with .specs/ structure
    usage: specpilot init <project-name> [options]
    arguments:
      project-name:
        required: true
        description: Name of the project directory to create
        validation: "^[a-zA-Z0-9][a-zA-Z0-9._-]*$ (max 214 chars)"
    options:
      --lang:
        type: string
        description: Programming language (typescript, javascript, python, kotlin, swift)
      --framework:
        type: string
        description: Framework (react, express, next, nest, vue, angular, fastapi, django, flask, streamlit, android, spring, ktor, compose, ios, swiftui, vapor)
      --dir:
        type: string
        default: "."
        description: Target directory
      --specs-name:
        type: string
        default: .specs
        description: Custom name for the specs directory
      --no-prompts:
        type: boolean
        description: Skip interactive prompts (use defaults)
      --dry-run:
        type: boolean
        description: List files that would be created without writing them
    interactive-prompts:
      - "Greenfield or brownfield project type"
      - "Framework selection"
      - "API paradigm (REST / CLI / GraphQL / None)"
      - "Short developer handle for task/prompt IDs"
      - "IDE selection (GitHub Copilot, Cursor, Windsurf, Antigravity, Claude Code, Codex)"
      - "What does your project do? (mandatory)"
      - "Who are the target users? (optional)"
      - "Expected scale? (optional)"
      - "Known constraints or requirements? (optional)"
    behavior:
      - "Files outside .specs/ that already exist are kept, never written or written through (wx), and listed after the success line: Kept as they were: <paths>. ... (BL-073)"
      - ".gitattributes: missing merge=union lines are appended and reported (Appended <n> line(s) to .gitattributes); it is never listed as kept"
      - "No overwrite / append / skip question for an existing CLAUDE.md or .github/copilot-instructions.md"
    exit-codes:
      0: Success
      1: Project already exists or validation error

  add-specs:
    description: Add .specs/ folder to an existing project with codebase analysis
    usage: specpilot add-specs [options]
    options:
      --lang:
        type: string
        description: Override auto-detected language (typescript, javascript, python, kotlin, swift)
      --framework:
        type: string
        description: Override auto-detected framework
      --no-analysis:
        type: boolean
        description: Skip codebase analysis (TODOs, tests, architecture)
      --deep-analysis:
        type: boolean
        description: Enable deep codebase analysis
      --no-prompts:
        type: boolean
        description: Skip interactive prompts
    interactive-prompts:
      - "Greenfield or brownfield project type"
      - "Framework selection"
      - "API paradigm (REST / CLI / GraphQL / None)"
      - "Short developer handle for task/prompt IDs"
      - "IDE selection (GitHub Copilot, Cursor, Windsurf, Antigravity, Claude Code, Codex)"
    behavior:
      - "Files outside .specs/ that already exist are kept, never written or written through (wx), and listed after the success line: Kept as they were: <paths>. ... (BL-073)"
      - ".gitattributes: missing merge=union lines are appended and reported (Appended <n> line(s) to .gitattributes); it is never listed as kept"
      - "No overwrite / append / skip question for an existing CLAUDE.md or .github/copilot-instructions.md"
    exit-codes:
      0: Success
      1: .specs/ already exists or error

  validate:
    description: Validate .specs/ folder structure and content
    usage: specpilot validate [options]
    options:
      --dir:
        type: string
        default: "."
        description: Project directory
      --fix:
        type: boolean
        description: Auto-fix issues where possible
      --verbose:
        type: boolean
        description: Show detailed validation results
    behavior:
      - "project.yaml with no rules key on its parsed root mapping (generated since 2.0.0): no rules warning and no prompt-tracking mandate error, so a fresh project passes this check; with a rules key (any value) both checks apply as before (BL-066)"
    exit-codes:
      0: Valid (may have warnings)
      1: Validation errors found

  list:
    description: List available language/framework templates
    usage: specpilot list [options]
    options:
      --lang:
        type: string
        description: Filter by language
      --verbose:
        type: boolean
        description: Show template details
    exit-codes:
      0: Success

  migrate:
    description: Convert legacy .project-spec folder to current .specs/ structure
    usage: specpilot migrate [options]
    options:
      --dir:
        type: string
        default: "."
        description: Project directory
      --from:
        type: string
        default: complex
        description: Source structure format (complex or project-spec)
      --to:
        type: string
        default: simple
        description: Target structure format
      --backup:
        type: boolean
        default: true
        description: Create backup before migration
    exit-codes:
      0: Success
      1: Migration error

  refine:
    description: Refine spec files with current project context
    usage: specpilot refine [description] [options]
    arguments:
      description:
        required: false
        description: Natural language description of changes to apply
    options:
      --dir:
        type: string
        default: "."
        description: Project directory
      --specs-name:
        type: string
        default: .specs
        description: Custom name for the specs directory
      --no-prompts:
        type: boolean
        description: Skip confirmation prompt (write directly)
      --update:
        type: boolean
        description: Regenerate specs with new description
    behavior:
      - Collects pending changes to requirements.md, context.md, prompts.md
      - Shows line-level diff preview before writing
      - Prompts for confirmation unless --no-prompts is set
      - "--update regenerates .specs/; files outside .specs/ that already exist are kept and listed, as for add-specs (BL-073)"
    exit-codes:
      0: Success (or no changes needed)
      1: Error

  archive:
    description: Archive oversized .specs/ files
    usage: specpilot archive [options]
    thresholds:
      development/prompts.md: "> 100 lines"
      planning/tasks.md: "Completed section > 40 lines"
    options:
      --dry-run:
        type: boolean
        description: Preview what would be archived without writing any files
      --force:
        type: boolean
        description: Skip branch warning and archive without confirmation
    behavior:
      - Warns and prompts before archiving on a non-main/non-master branch
      - Appends archived entries to prompts-archive.md or tasks-archive.md
      - "prompts.md: moves the oldest whole entries (list items under ## Latest Entries, or rows under ## Prompt History), in whichever order the file runs, told from the entries' dates; refuses with a reason when the order cannot be told"
    exit-codes:
      0: Success
      1: Archive error

  backfill:
    description: Backfill missing SpecPilot mandates into existing projects
    usage: specpilot backfill [options]
    options:
      --dir:
        type: string
        default: "."
        description: Project directory
      --specs-name:
        type: string
        default: .specs
        description: Custom name for the specs directory
      --dry-run:
        type: boolean
        description: Preview changes without writing any files
      --no-prompts:
        type: boolean
        description: Accept suggested devPrefix silently when team.devPrefix is missing
    behavior:
      - Non-destructively patches missing mandates in project.yaml and AI context files
      - "Checks each file in the wording SpecPilot generates for it (BL-066): copilot-instructions.md by the wording it has (terse unless it carries the pre-2.0 verbose list); a project.yaml with no top-level rules: key is left unchanged (skipped, with the reason)"
      - "Backfills tasks.md with the devPrefix Completed-ID convention line when neither CD-{devPrefix}-### nor CD-<handle>-### is present (BL-069); ## Multi-Dev Notes is no longer added"
      - Detects existing IDE files and patches only the files present on disk
      - Reports stale Claude Code SKILL.md structure without auto-patching it
      - "Slash commands (BL-058): for each IDE signal present (incl. CODEX_INSTRUCTIONS.md for the in-repo .codex/prompts/ copies) adds missing specpilot-* command files and replaces those whose bytes match a known SpecPilot version (SHA-256); never writes outside the project directory"
      - "Keeps, never writes: edited files (kept: modified, delete it and re-run specpilot backfill to get the latest version), files that match only after CRLF to LF (kept: CRLF line endings), symbolic links and other non-regular files; kept files do not change the exit code"
    exit-codes:
      0: Success
      1: Backfill error

  serve:
    description: Serve a local web UI over the .specs/ of the current project or of each folder named, with task moves and new tasks (BL-PM-005), guided setup of a named folder without .specs/, opening more folders from the page, remembered in ~/.specpilot/projects.json, starting a new project in a new or empty folder, and cloning a repository into one with the installed git, unless --read-only (BL-051, BL-053, BL-054, BL-055, BL-067, BL-PM-003, BL-PM-002)
    usage: specpilot serve [folders...] [options]
    arguments:
      folders:
        type: string[]
        default: the current directory
        description: Project folders to serve, in this order (project 0, 1, ...); folders opened from the page get the next indices (BL-067) and no index ever changes while the server runs; the same folder named twice is served once; a named folder without .specs/ is served and offers guided setup (BL-055); named folders are recorded in ~/.specpilot/projects.json only when that file already exists
    options:
      --port:
        type: number
        default: 4321
        description: Port to listen on (127.0.0.1 only)
      --poll:
        type: number
        default: 1000
        description: Change-detection interval in ms (minimum 250); polling runs only while a page is open
      --read-only:
        type: boolean
        description: No write routes (405), no drag handles, no setup form, no + tile or Open sheet, no registry read or write, no token; the UI only reads
      --mcp:
        type: boolean
        description: "BL-PM-007 (REQ-002.H.33). Reads SPECPILOT_MCP_TOKEN (32+ visible ASCII characters, else exit 1) as the /mcp token when set. Add POST /mcp, a local MCP endpoint for AI IDEs, and the Connect Your AI IDE card on Home; off by default. With --read-only only the read tools are offered"
      --open:
        type: boolean
        description: Open the UI in the default browser
    routes:
      "GET /": The UI page
      "GET /assets/<file>": The UI's stylesheet, scripts and favicon (the SpecPilot logo)
      "GET /api/specs": "Project metadata (incl. project.specs: whether .specs exists, BL-055; project.cursor: whether .cursor/rules/specpilot.mdc is a regular file, checked by resolveAllowedPath() with that one path allowed, not served, BL-PM-010), readSpecs() output (each task row carries line, its 1-based line in tasks.md, BL-PM-008), the nav tree (nav.commands, nav.prompts and nav.skills entries carry generated: true|false, BL-PM-006) and projects: [{name, root, branch}] for every served project, root as ~/... under the home directory (JSON)"
      "GET /api/file?p=<path>": One allowlisted file of the named project as text/plain
      "POST /api/tasks/move": "Move one task row between Backlog and Current Sprint, or reorder within one. JSON body {id, toSection: backlog|currentSprint, toIndex}; headers If-Match (sha256 of tasks.md as last loaded), X-SpecPilot-Token (from the page's meta tag), Origin (the page's own), Content-Type application/json; body <= 16 KB. 200 {sha256, specs}; 409 {error, specs} when the file changed; 422 {error} for an unknown, duplicate or Completed id, a section without a table, a bad index, or a move that cannot keep every other byte; 403 token/Origin/Host (Origin must equal http:// + Host); 400 body not JSON; 413 too large; 415 not application/json; 428 no If-Match; 405 with --read-only"
      "POST /api/tasks/new": "BL-PM-005. Append one task row to Backlog or Current Sprint. JSON body {description, section: backlog|currentSprint}; headers If-Match (sha256 of tasks.md as last loaded), X-SpecPilot-Token, Origin (the page's own), Content-Type application/json; body <= 16 KB. The server picks the ID: BL (Backlog) or CS (Current Sprint) and the highest number of that prefix in ID positions (a table row's ID cell, the leading tags of an archived list item) of tasks.md and tasks-archive.md plus one, >= 3 digits. The line is | <ID> | <description> |, the description as typed with surrounding white space removed. 200 {sha256, id, section, index, specs}, index = the new row's 0-based position among that section's rows (its last); 409 {error, specs} when the file changed; 422 {error} for an empty description, a line break (CR, LF, U+2028, U+2029), other control character (U+0000-U+001F, U+007F-U+009F), unpaired surrogate or | in it, a trailing backslash, more than 4000 Unicode code points, another section, a section without a table, tasks.md a symbolic link or not valid UTF-8, tasks-archive.md a symbolic link, not a regular file, unreadable or not valid UTF-8, no line break at the end of the file where the row would go last, or a row the tasks.md checks of specpilot validate would report; 403 token/Origin/Host; 400 body not JSON; 413 too large; 415 not application/json; 428 no If-Match; 405 with --read-only"
      "POST /api/commands/regenerate": "BL-PM-006 (REQ-002.H.30). Run specpilot backfill's command step in the named project: for each IDE whose signal file is present, create missing specpilot-* command files and replace those whose bytes match KNOWN_COMMAND_HASHES for their path; keep everything else. JSON body {} (nothing else); headers X-SpecPilot-Token, Origin (the page's own), Content-Type application/json; no If-Match. 200 {added: [path], updated: [path], kept: [{path, reason}], message: [line], specs} (message: the result lines the page shows verbatim); kept reasons: modified, CRLF line endings, symbolic link, not a regular file, folder is a symbolic link or not a folder, could not be written: <code>; 400 not JSON; 422 other body or no .specs/; 500 unexpected error (files may be partly written); 403/415/413 as a move; 405 with --read-only. Never writes instruction files, SKILL.md or .specs/"
      "POST /mcp": "BL-PM-007 (REQ-002.H.33), only with --mcp (else as any unknown path). Stateless MCP Streamable HTTP: one JSON-RPC message per POST, application/json answers only, no session id; GET/DELETE 405 (Allow: POST). Headers: X-SpecPilot-Token (the per-start token, or SPECPILOT_MCP_TOKEN when set; missing or wrong 403 with a JSON-RPC error naming the header), Origin absent or the page's own, Content-Type application/json, MCP-Protocol-Version (2025-11-25 or 2025-06-18 when sent, else 400; initialize answers the client's version when supported, else 2025-11-25; no batches, so 2025-03-26 is not offered); body <= 16 KB. Methods initialize, ping, tools/list, tools/call; notifications 202; others -32601; arrays -32600; bad JSON -32700 (HTTP 400). Tools: specpilot_list_projects, specpilot_read_spec {path}, specpilot_list_tasks, specpilot_new_task {description, section, sha256}, specpilot_move_task {id, toSection, toIndex, sha256}, specpilot_validate_specs, specpilot_regenerate_commands; each takes optional project (default 0). Refusals are tool results with isError true and the page route's text (a stale sha256: since you last read it). 403 Host/Origin/token; 413; 415. With --read-only the three write tools are absent (-32602), the token for /mcp is a separate one and every page write route still answers 405. Revision 2026-07-28 (BL-089), chosen per request when params._meta carries io.modelcontextprotocol/protocolVersion: version not 2026-07-28 400 -32022 {supported, requested}; MCP-Protocol-Version, Mcp-Method and (tools/call) Mcp-Name must equal the body (base64 sentinel decoded; repeats found in rawHeaders; tools/call without a string params.name included) else 400 -32020; clientCapabilities not an object 400 -32602; server/discover, tools/list and tools/call with resultType complete, ttlMs 0 and cacheScope private on lists, serverInfo in result _meta; other methods 404 -32601"
      "GET /api/setup": "BL-055. For a named folder (command line, or opened from the page since BL-067) with no .specs: the questions add-specs would ask there (project type; language only when none is detected; framework only when none is detected and the language has some; API paradigm; handle with the OS username as default; IDE/Agent), each with the CLI's message and choices, (JSON {questions: [{key, message, choices?}], frameworks?: {<language>: [...]} when language is asked, detected: {language, framework, line} or null, keep: {<ide>: [paths outside .specs/ that add-specs would write for that choice and that already exist]}}); writes nothing. 404 when the project has .specs or was not named (named = on the command line or opened from the page, BL-067; the current-directory default is not); 422 {error} when the detector cannot read the folder (e.g. invalid package.json); 405 with --read-only. BL-PM-004 adds step, order, required, chat, label and, on a text question, placeholder on each question, steps and files {specs, outside} as GET /api/projects/new has them. BL-PM-004b (REQ-002.H.28): unchanged; the questions of the 23 fields, their options, rules and captions come from /assets/chat-core.js"
      "POST /api/setup": "BL-055. Create what specpilot add-specs creates in that folder; .specs must not exist; files outside .specs/ that already exist are kept untouched. JSON body {projectType, language?, framework?, apiParadigm, handle, ide}; headers X-SpecPilot-Token, Origin (the page's own), Content-Type application/json; body <= 64 KB (BL-PM-004b; 16 KB before). 200 {specs, kept: [paths left as they were], notice: the Codex copy-them-yourself text or null}; 404 when the project was not named (the current-directory default); 409 {error, specs} when .specs exists now or appeared during the creates (rolled back); 409 {error} naming it when a parent folder of a generated file is a link or not a folder (nothing written); 422 {error} naming the field for a value that was not offered, a key that is neither a CLI answer nor one of the 23 fields of BL-PM-004b, a missing key, a non-string value for a CLI answer, a handle outside ^[A-Za-z0-9][A-Za-z0-9._-]{0,38}$ (empty = the OS username) or a folder the detector cannot read; 403 token/Origin/Host; 400 body not JSON; 413 too large; 415 not application/json; 500 after removing what it created when a write fails; 405 with --read-only. BL-PM-004b (REQ-002.H.28): the body may also carry the 23 optional fields of REQ-002.I.4 (text <= 1000 or <= 100 characters, lists <= 25 strings of <= 100, integrations an object keyed by the eight category ids; one line, no control characters; 422 naming the key), passed to the generator; body <= 64 KB"
      "GET /api/events": "Server-sent events (text/event-stream). `event: change`, `data: {\"paths\": [...]}` with the changed allowlisted paths only, no content; heartbeat comment every 25 s; at most 8 open streams across all projects, 503 beyond"
      "GET /api/projects": "BL-067. The project registry ~/.specpilot/projects.json: JSON {path: '~/.specpilot/projects.json', entries: [{path, root (as ~/...), lastOpened (ISO 8601), pinned, project (served index or null), exists (is a directory now)}] in display order (pinned first, then newest first), error: null or the plain reason the file could not be used (then entries is empty)}; reads nothing from the folders but one stat each; no project parameter; 405 with --read-only"
      "POST /api/projects": "BL-067. Open one more folder on the running server and remember it. JSON body {path} (one key; string of 1 to 4096 characters, no NUL; a leading ~ or ~/ means the home directory; then absolute); headers X-SpecPilot-Token, Origin (the page's own), Content-Type application/json; body <= 16 KB. The path is realpath-resolved, must be a directory and must not be the home directory, / (or a drive root) or a folder already served. 200 {project: n (the new index = the previous count), specs (project n's /api/specs payload), registry (the GET body; registry.error set when the file could not be written, the folder is open all the same)}; 409 {error, project: n} when the folder is already served (also via a link, or the current-directory default); 409 {error} when 20 projects are already served (one server's cap; the command line is not capped); 422 {error} for a relative path, a folder whose allowlisted files cannot be read (nothing served), a missing folder, a file, home or a root, a bad body shape; 403 token/Origin/Host; 400 body not JSON; 413 too large; 415 not application/json; 500 {error} when the locked part throws (the lock survives); 405 with --read-only. Never writes inside the folder; existing project indices never change"
      "POST /api/projects/remove": "BL-067. Remove one entry from the registry. JSON body {path}, matched byte for byte against the stored path (no ~ expansion, no realpath); same headers and checks as POST /api/projects. 200 with the GET /api/projects body; 422 {error} when the path is not in the list or the registry could not be used; 403/400/413/415 as above; 405 with --read-only. Touches nothing in the folder; a served project stays served"
      "GET /assets/chat-core.js": "BL-PM-004b (REQ-002.I.7). The compiled src/core/chatFlow.ts (dist/core/chatFlow.js) wrapped as (function (exports) { ... })(window.SpecPilotChat = {}), its source-map line dropped; text/javascript; same-origin under the existing CSP. Sent with and without --read-only (the page asks no question then)"
      "GET /api/projects/new": "BL-PM-003. The questions specpilot init asks, in its order, with the CLI's own messages and choices: {questions, frameworks}; project type (Greenfield first), language, framework (per language), API paradigm, handle, IDE, and the four project-context questions. Reads no folder, writes nothing. 422 when the OS username cannot be read; 405 with --read-only. BL-PM-004 adds, without changing a field or the order of questions: step, order (the chat's order), required, chat (the setup chat's friendly wording, with {name} and {language} placeholders), label (a short recap label) and, on a text question, placeholder on each question, steps (the step labels in order), files {specs: {<apiParadigm>: [paths]}, outside: {<ide>: [paths]}}; the four project-context questions carry when: {projectType: greenfield} (the page asks them only then). BL-PM-004b: unchanged, as GET /api/setup"
      "POST /api/projects/new": "BL-PM-003. Create <parent>/<name> when it is missing (one non-recursive mkdir) or use it when it is an empty folder, write there what specpilot init writes (same generateSpecs() call, staged then created exclusively, byte-identical), then serve and remember it as POST /api/projects does. JSON body {parent, name, projectType, language, framework?, apiParadigm, handle, ide, whatItDoes, targetUsers?, expectedScale?, constraints?}; headers X-SpecPilot-Token, Origin. 200 {project, specs, registry, kept, notice}; 400 not JSON; 403 Origin or token; 413 over 64 KB (16 KB before BL-PM-004b); 415 not JSON content type; 422 shape, a parent or an existing target that fails the path rule (a home or root parent answers 'Pick a folder inside your home folder, like ~/dev.'), a parent at or under a .specs folder, a folder that could not be created, or a created folder that could not be read afterwards (its files stay, nothing is served or recorded); 409 target is a link, not a folder, not empty, already open (with project), made by something else meanwhile, or 20 projects already served; 500 a write failed and what was created was removed; 405 with --read-only. BL-PM-004: whatItDoes is required only when projectType is greenfield (init writes the four context answers nowhere for brownfield, BL-082); when sent they are checked as before. BL-PM-004b: the 23 optional fields as POST /api/setup; body <= 64 KB; with none of them the files are byte for byte as before"
      "POST /api/preview": "BL-PM-004b (REQ-002.H.28; accepted by the developer, open question 4). Render what the create would write, writing nothing: the body of POST /api/projects/new without parent (a new project) or of POST /api/setup with ?project=<n> (guided setup, which reads the folder as GET /api/setup does for the kept list), checked the same way; headers X-SpecPilot-Token, Origin; body <= 64 KB. 200 {files: [{path, content}] in write order, kept: [paths that exist and would be kept], onboardingPrompt}; 400/403/413/415/422 as the create routes; 404 for guided setup when the project was not named or has .specs; 405 with --read-only. Takes no lock; touches no file"
      "POST /api/projects/clone": "BL-PM-002. Clone a repository into <parent>/<name> with the installed git, then serve the folder (Tasks view with .specs/, guided setup without). JSON body {url, parent, name}, all strings; url 1 to 2048 characters, no whitespace or control character, one of https://host[:port]/path, ssh://[user@]host[:port]/path or user@host:path on a fixed character set, no user or password in an https URL; parent as POST /api/projects/new; name empty (taken from the URL) or 1 to 214 characters of the init name rule; same headers and checks as POST /api/projects. The target must be missing (one non-recursive mkdir) or an empty folder. Runs git clone --no-recurse-submodules -- <url> <target> as an argument array (no shell) with GIT_ALLOW_PROTOCOL=https:ssh, no prompt (GIT_TERMINAL_PROMPT=0, no askpass, no terminal; on Windows also ssh BatchMode unless the user has an ssh command of their own) and a 10-minute limit; one clone at a time, outside the write lock. 200 {project, specs, registry} as POST /api/projects; 400 bad JSON; 403/415/413 as the other write routes; 422 a field, the URL, the parent, git is not installed, git clone failed (its last fatal line with the line before it, 300 characters at most), the limit, or the folder could not be read; 503 the server is stopping; 409 another clone is running, the target is being cloned, the target is a link, not a folder, not empty, already open (with project), made by something else meanwhile, or 20 projects already served; on failure, the limit, a closed connection or server stop the folder is emptied, and removed when the request created it; 405 with --read-only"
    behavior:
      - Binds 127.0.0.1 only; rejects any Host header other than 127.0.0.1:<port> or localhost:<port> (403)
      - In a project with .specs/, writes only its .specs/planning/tasks.md (one line moved or appended; temp file, fsync, rename) and, through POST /api/commands/regenerate (BL-PM-006), its specpilot-* command files at KNOWN_COMMAND_HASHES paths; --read-only disables both
      - "Guided setup (BL-055): in a named folder without .specs, generates with the same SpecGenerator call as add-specs into a marked staging folder inside it (.specpilot-setup-<12 hex>/ with the file .specpilot-setup), then creates each file with an exclusive create and fsync; never overwrites, appends to or merges an existing file (kept and listed instead); the staging folder is removed in every outcome; --read-only disables it"
      - "Startup (not --read-only): removes each .specpilot-setup-<12 hex> entry of a served folder that is a real folder holding the marker file, printing 'Removed <root>/.specpilot-setup-<id>/, left by an interrupted setup.'; nothing else is ever removed"
      - "Project registry (BL-067): ~/.specpilot/projects.json, {version: 1, projects: [{path (realpath), lastOpened (ISO 8601 UTC), pinned}]}, at most 50 entries (the oldest unpinned dropped first); the folder (mode 0700) and file (mode 0600) are created only when the first entry is written; every write is temp file in the same folder + fsync + rename, after re-reading under the write lock; nothing in this version sets pinned (stored and honoured in ordering only). The only file SpecPilot writes outside a project; --read-only never reads or writes it"
      - "Registry refusals (never repaired or replaced): ~/.specpilot not a real folder, projects.json not a regular file (a link is not followed), unreadable, not JSON, or not the one shape → startup prints '<path> could not be read (<reason>). It was left as it is; projects opened in this run are not remembered.', GET /api/projects returns the reason in error, POST /api/projects still opens the folder and returns the reason in registry.error, POST /api/projects/remove answers 422"
      - "Clone (BL-PM-002): the only process a request starts and the only use of the network; SpecPilot's own code opens no outbound connection. Only the URL (after --) and the target folder reach git's command line; no branch, depth or option can be set; submodules are not cloned; Ctrl+C, SIGTERM and SIGHUP stop a running clone and remove what it downloaded before the server exits 0, waiting at most 5 seconds for that; --read-only disables it"
      - "POST /api/projects is the only way a folder is added while the server runs; the registry never adds a served root by itself; nothing removes or reorders a served root; the route never writes inside the folder"
      - "/api/specs, /api/file, /api/events, /api/setup, POST /api/tasks/move, POST /api/tasks/new and POST /api/commands/regenerate take ?project=<n>: the project's index (its position on the command line, then the order folders were opened from the page), from 0; omitted = 0; otherwise one value matching ^(0|[1-9][0-9]*)$ naming a served project, else 404 (empty, repeated, 01, +1, out of range); on the POST routes resolved after the Origin, token, content-type and size checks; the registry routes take no project parameter"
      - "Startup output: one project = unchanged; more = 'SpecPilot is serving <N> projects at <url>' then one line per project, '  <n>  <root>'; each folder without .specs/ adds 'No .specs/ in <root> yet. Open the page to set it up.' ('No .specs/ in <root>.' with --read-only); without --read-only one more gray line after the hint, 'Folders opened in the page are remembered in ~/.specpilot/projects.json.'; a registry that cannot be read adds its refusal line (above)"
      - Re-reads files on every request
      - Live reload polls allowlisted files with stat() every --poll ms while a page is open, and pushes changed paths on /api/events
      - Methods other than the route's own return 405; unknown paths return 404
    exit-codes:
      0: Stopped with Ctrl+C
      1: A named folder that does not exist or is not a directory (named in the message), no folder named and no .specs/ in the current directory, invalid --port or --poll, or port already in use

global-options:
  --version:
    description: Show SpecPilot version
  --help:
    description: Show help for any command

aliases:
  init: i
  validate: v
  migrate: m
  list: ls
  refine: ref
  archive: ar
  add-specs: add
  backfill: bf
